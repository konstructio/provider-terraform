name: Build and Push Shard Assigner (konstructio ghcr)

# Builds the Workspace shard assigner and pushes it to
# ghcr.io/konstructio/provider-terraform-shard-assigner. Separate from the
# controller image workflow because it is a separate binary with its own
# Dockerfile and its own release cadence.
#
# Tags produced:
#   git tag  vX.Y.Z    -> :vX.Y.Z and :latest
#   push to  main-civo -> :main-civo and :sha-<8>
#   push to  hotfix-*  -> :branch-<8>
#   push to  feat/*    -> :branch-<8>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v0.0.1-rc.1)'
        required: true
  push:
    branches:
      - 'main-civo'
      - 'hotfix-*'
      - 'feat/**'
    tags:
      - 'v*'
    paths:
      - 'cmd/shard-assigner/**'
      - 'internal/shard/**'
      - 'apis/**'
      - 'Dockerfile.shard-assigner'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-push-shard-assigner.yaml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/konstructio/provider-terraform-shard-assigner

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: tag
        run: |
          SHORT="${GITHUB_SHA::8}"
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            workflow_dispatch:*)
              TAGS="${IMAGE}:${{ github.event.inputs.tag }}" ;;
            push:refs/tags/*)
              TAGS="${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" ;;
            push:refs/heads/main-civo)
              TAGS="${IMAGE}:main-civo,${IMAGE}:sha-${SHORT}" ;;
            *)
              TAGS="${IMAGE}:branch-${SHORT}" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Building: $TAGS"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shard-assigner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.tags }}
