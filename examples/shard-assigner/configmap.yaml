# Desired sharding state. The assigner watches this ConfigMap; any change
# re-evaluates placement for every Workspace.
#
# shardCount is explicit desired state and is never derived from pod liveness.
# If it were, every rolling update, OOM kill and node drain would look like a
# scale-down and trigger a spurious reshuffle.
apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-terraform-shards
  namespace: crossplane-system
data:
  # Shards shard-0 .. shard-{shardCount-1} must each have a provider Deployment
  # running with a matching --shard-name.
  shardCount: "4"

  # Comma-separated shards that still own Workspaces but must take no more.
  # The assigner migrates their Workspaces away one at a time. Leave empty in
  # steady state.
  draining: ""
